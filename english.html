<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">

<title>Year 6 English — NSW Stage 3</title>

<style>
  :root{
    --paper:#fbf6ec; --ink:#2b2b2e;
    --teal:#1f7a72; --teal-dk:#155a54;
    --coral:#ee6c4d; --coral-dk:#d4502f;
    --green:#3a9d6b; --green-dk:#2c7a52; --green-soft:#e3f3e9;
    --berry:#c25b87; --berry-dk:#9e426a; --berry-soft:#f7e6ee;
    --amber:#e6a23c; --amber-dk:#c2811f;
    --sun:#f4b942;
    --coral-soft:#fdeadf;
    --line:#e6dcc8; --card:#ffffff;
    --shadow:0 6px 0 rgba(0,0,0,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  h1,h2,h3,.display{font-family:'Baloo 2',cursive;letter-spacing:.2px}
  body{
    font-family:'Nunito',sans-serif;color:var(--ink);line-height:1.5;min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(238,108,77,.16), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(31,122,114,.12), transparent 45%),
      var(--paper);
    background-attachment:fixed;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:24px 18px 40px}

  header.site{text-align:center;padding:26px 0 10px}
  header.site .kicker{display:inline-block;background:var(--coral);color:#fff;font-weight:800;
    font-size:.8rem;letter-spacing:1.5px;text-transform:uppercase;padding:5px 14px;border-radius:30px;
    margin-bottom:12px;box-shadow:0 4px 0 var(--coral-dk)}
  header.site h1{font-size:clamp(2rem,6vw,3.2rem);color:var(--ink);line-height:1.02}
  header.site h1 span{color:var(--teal)}
  header.site p.sub{max-width:560px;margin:10px auto 0;color:#6a6357;font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:24px}
  .strand-label{grid-column:1/-1;font-family:'Baloo 2';font-size:1.15rem;margin-top:14px;
    display:flex;align-items:center;gap:10px;color:var(--coral-dk)}
  .strand-label::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--teal);
    display:inline-block;transform:rotate(45deg)}
  .card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .card::after{content:"";position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;
    background:var(--accent,var(--coral));opacity:.08}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 0 rgba(0,0,0,.07)}
  .card .num{font-family:'Baloo 2';font-size:.95rem;color:#fff;background:var(--accent,var(--coral));
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;
    margin-bottom:10px;box-shadow:0 3px 0 rgba(0,0,0,.14)}
  .card h3{font-size:1.18rem;line-height:1.1;color:var(--ink)}
  .card p{font-size:.85rem;color:#867d6d;margin-top:6px;font-weight:600}

  /* back / hub buttons */
  .backbtn{background:#fff;border:2px solid var(--line);border-radius:30px;padding:8px 16px;
    font-family:'Baloo 2';font-size:.95rem;cursor:pointer;color:var(--coral-dk);
    box-shadow:0 3px 0 rgba(0,0,0,.06);text-decoration:none;display:inline-block}
  .backbtn:hover{background:var(--coral-soft)}
  .backbtn.hub{color:#fff;background:var(--teal);border-color:transparent;box-shadow:0 3px 0 var(--teal-dk)}
  .backbtn.hub:hover{background:var(--teal-dk)}
  .nav-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
  #home .nav-row{margin-top:6px}

  .topic-view{display:none}
  .topic-view.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .topic-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;margin-bottom:6px}
  .topic-head h2{font-size:clamp(1.6rem,5vw,2.4rem);color:var(--ink)}
  .topic-head .badge{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;
    padding:4px 12px;border-radius:20px;background:var(--coral-soft);color:var(--coral-dk)}
  .topic-intro{color:#6a6357;font-weight:600;margin-bottom:20px;max-width:640px}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
  .tabs{display:inline-flex;background:#fff;border:2px solid var(--line);border-radius:30px;padding:4px;
    box-shadow:0 3px 0 rgba(0,0,0,.05)}
  .tab{border:none;background:transparent;font-family:'Baloo 2';font-size:1rem;padding:8px 22px;
    border-radius:24px;cursor:pointer;color:#8a8275}
  .tab.simple.on{background:var(--green);color:#fff}
  .tab.hard.on{background:var(--berry);color:#fff}
  .btn{border:none;font-family:'Baloo 2';font-size:.95rem;padding:9px 18px;border-radius:24px;cursor:pointer;
    color:#fff;background:var(--coral);box-shadow:0 4px 0 var(--coral-dk);transition:transform .1s}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--coral-dk)}
  .btn.ghost{background:#fff;color:var(--coral-dk);border:2px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.06)}
  .btn.sun{background:var(--sun);box-shadow:0 4px 0 #cf9514;color:#5a4205}

  .ws-title{font-family:'Baloo 2';font-size:1.3rem;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ws-title .pill{font-size:.7rem;font-weight:800;text-transform:uppercase;padding:3px 10px;border-radius:20px;letter-spacing:.5px}
  .pill.green{background:var(--green-soft);color:var(--green)}
  .pill.berry{background:var(--berry-soft);color:var(--berry-dk)}
  .ws-note{color:#9a917f;font-size:.85rem;font-weight:600;margin-bottom:16px}

  ol.questions{list-style:none;counter-reset:q}
  ol.questions li{counter-increment:q;background:#fff;border:2px solid var(--line);border-radius:14px;
    padding:14px 16px 14px 54px;margin-bottom:10px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.04)}
  ol.questions li::before{content:counter(q);position:absolute;left:12px;top:12px;width:30px;height:30px;
    background:var(--paper);border:2px solid var(--line);border-radius:9px;display:flex;align-items:center;
    justify-content:center;font-family:'Baloo 2';font-size:.9rem;color:var(--coral-dk)}
  ol.questions .qtext{font-weight:700;font-size:1.02rem}
  ol.questions .ans{margin-top:8px;font-weight:700;color:var(--green);background:var(--green-soft);
    border-radius:8px;padding:6px 12px;display:none;font-size:.95rem}
  ol.questions .ans::before{content:"Answer: ";color:#2c7a52}
  body.show-answers ol.questions .ans{display:block}
  .reveal{margin-top:8px;background:transparent;border:none;color:var(--coral-dk);font-family:'Baloo 2';
    font-size:.85rem;cursor:pointer;padding:0;text-decoration:underline}
  body.show-answers .reveal{display:none}

  /* comprehension passages */
  .passage{background:#fff;border:2px solid var(--line);border-left:6px solid var(--teal);
    border-radius:14px;padding:16px 20px;margin:6px 0 12px;box-shadow:0 3px 0 rgba(0,0,0,.04)}
  .passage .ptag{display:inline-block;font-family:'Baloo 2';font-size:.68rem;text-transform:uppercase;
    letter-spacing:.6px;background:var(--teal);color:#fff;padding:3px 11px;border-radius:14px;margin-bottom:8px}
  .passage h4{font-family:'Baloo 2';font-size:1.18rem;color:var(--ink);margin-bottom:8px}
  .passage p{font-size:1rem;line-height:1.65;color:#3a362f}
  .qgroup-label{font-family:'Baloo 2';font-weight:700;color:var(--teal-dk);margin:2px 0 10px;font-size:.98rem}
  .qgroup-label + ol.questions{margin-bottom:22px}

  @media print{
    body{background:#fff}
    header.site,.grid,.toolbar,.backbtn,.nav-row,.reveal{display:none!important}
    .topic-view{display:block!important}
    ol.questions li{box-shadow:none;break-inside:avoid}
    .card{display:none}
  }
</style>
</head>

  { title:'Why We Should Protect the Reef', text:'The Great Barrier Reef, stretching more than 2,000 kilometres along the coast of Queensland, is the largest living structure on Earth. It is home to thousands of species of fish, coral, turtles and other sea creatures. Sadly, the reef is under threat. Rising sea temperatures cause coral to lose its colour and die, a process known as bleaching. Pollution and litter from the land also harm the delicate ecosystem. Scientists warn that if we do not act soon, large parts of the reef could disappear forever. There are things we can all do to help, such as reducing waste, using less energy and supporting organisations that protect the ocean. The reef has survived for millions of years — it is up to us to make sure it survives for millions more.',
    qs:[
      {q:'Along which coast is the Great Barrier Reef found?', a:'the coast of Queensland'},
      {q:'What does the text say makes the reef special?', a:'it is the largest living structure on Earth'},
      {q:'What does “bleaching” mean in this passage?', a:'coral losing its colour and dying'},
      {q:'Name two things that threaten the reef.', a:'rising sea temperatures and pollution / litter'},
      {q:'What is the author’s main purpose in this text?', a:'to persuade us to protect the reef'},

    ]},
  { title:'The Audition', text:'Priya’s hands trembled as she waited in the wings, clutching her sheet music. For weeks she had rehearsed until her fingers ached, yet now every note seemed to flee from her memory. The girl before her finished to warm applause and walked off stage beaming. ‘Next!’ called the judge, not unkindly. Priya forced her legs to move. She sat at the piano, took a slow breath, and let her hands settle on the keys. The first few bars wavered, but then something shifted. The music seemed to play itself, flowing from her fingers as if it had a life of its own. When she finished there was a heartbeat of silence — and then the room erupted. Priya allowed herself, at last, to smile.',
    qs:[
      {q:'What is Priya auditioning to do?', a:'play the piano'},
      {q:'Where is Priya waiting at the start?', a:'in the wings (at the side of the stage)'},
      {q:'What does it mean that the notes “seemed to flee from her memory”?', a:'she felt she was forgetting the music'},
      {q:'How did Priya feel before her turn? Give evidence.', a:'nervous — her hands trembled'},

  { title:'Sleep and the Brain', text:'Most children your age need between nine and eleven hours of sleep each night, yet many get far less. While we sleep, our bodies may be still, but our brains are remarkably busy. During the night the brain sorts through everything we learned during the day, storing important memories and clearing away information it no longer needs. This is one reason why a good night’s sleep before a test can be more useful than late-night study. Sleep also helps the body grow, repair itself and fight off illness. Screens, however, can make sleep harder: the bright light from phones and tablets tricks the brain into thinking it is still daytime. Experts suggest switching off devices at least an hour before bed to give the brain the rest it needs.',
    qs:[

      {q:'How do screens make sleep harder?', a:'their bright light tricks the brain into thinking it is still daytime'},

const WRITE_S=[
  {q:'Turn this into a question: “The dog is hungry.”', a:'“Is the dog hungry?”'},
  {q:'Add an adjective: “The ___ castle stood on the hill.”', a:'e.g. “ancient”, “enormous” or “crumbling” — any describing word'},
  {q:'Write a sentence about the beach that uses one adjective.', a:'e.g. “The golden sand stretched along the warm beach.”'},
  {q:'Fix the capital letter and full stop: “we went to the park”', a:'“We went to the park.”'},
  {q:'Expand this sentence with more detail: “The cat sat.”', a:'e.g. “The fluffy ginger cat sat lazily on the warm windowsill.”'},
  {q:'Join into one sentence using “and”: “I like apples. I like pears.”', a:'“I like apples and pears.”'},
  {q:'Write a strong opening line for a story about a lost dog.', a:'e.g. “Rex had never been so far from home before.”'},
  {q:'Replace the dull word “nice”: “It was a nice day.”', a:'e.g. “glorious”, “beautiful” or “sunny”'},
  {q:'Add commas to the list: “I packed shorts a hat and sunscreen.”', a:'“I packed shorts, a hat and sunscreen.”'},
  {q:'Write a sentence that uses the word “because”.', a:'e.g. “We stayed inside because it was raining.”'},
  {q:'Add speech marks: She said I am ready', a:'She said, “I am ready.”'},

  {q:'Write a complex sentence using “although”.', a:'e.g. “Although the test was hard, she stayed calm.” (Look for a subordinate clause.)'},
  {q:'Write a persuasive sentence arguing for more sport at school.', a:'e.g. “Daily sport keeps students healthy and helps them focus.” (Look for an opinion + reason.)'},
  {q:'Write a metaphor describing the rain.', a:'e.g. “The rain was a thousand tiny drummers on the roof.”'},
  {q:'Write a simile to describe how fast a cheetah runs.', a:'e.g. “The cheetah ran like a bolt of lightning.”'},
  {q:'Plan a narrative about a mysterious key: write the orientation, complication and resolution in one line each.', a:'Look for: setting & characters; a problem; how it is solved.'},

/* =================== TOPICS =================== */
const POOLS={
  reading:{s:READ_S,h:READ_H},
  writing:{s:WRITE_S,h:WRITE_H}, grammar:{s:GRAM_S,h:GRAM_H}, spelling:{s:SPELL_S,h:SPELL_H}
};
function GEN(id){
  if(id==='comprehension') return {simple:take(COMP_PASS_S,2), hard:take(COMP_PASS_H,2)};
  return {simple:take(POOLS[id].s,12), hard:take(POOLS[id].h,12)};
}

const TOPICS=[
  {id:'reading',       name:'Reading',       group:'understand', accent:'var(--coral)', intro:'Vocabulary, word meanings, prefixes and suffixes, text features and figurative language.'},
  {id:'comprehension', name:'Comprehension', group:'understand', accent:'var(--teal)',  intro:'Read short texts and answer literal and inferential (“read between the lines”) questions.'},
  {id:'writing',       name:'Writing',       group:'language',   accent:'var(--berry)', intro:'Build and improve sentences, add detail, and write for imaginative, informative and persuasive purposes.'},
  {id:'grammar',       name:'Grammar',       group:'language',   accent:'var(--amber)', intro:'Word types, verb tenses, sentence structure, subject–verb agreement and punctuation.'},
  {id:'spelling',      name:'Spelling',      group:'language',   accent:'var(--green)', intro:'Spelling patterns, plurals, suffixes, prefixes and tricky homophones.'}
];
const GROUP={understand:'Reading & Understanding', language:'Writing & Language'};

function renderGrid(){
  let html='', last='';
  TOPICS.forEach((t,i)=>{
    if(t.group!==last){html+=`<div class="strand-label">${GROUP[t.group]}</div>`;last=t.group;}
    html+=`<div class="card" style="--accent:${t.accent}" onclick="openTopic('${t.id}')">
      <div class="num">${i+1}</div><h3>${t.name}</h3><p>${t.intro}</p></div>`;
  });
  document.getElementById('topicGrid').innerHTML=html;
}

let current=null, diff='simple', data=null;
function openTopic(id){
  current=TOPICS.find(t=>t.id===id); diff='simple';
  document.body.classList.remove('show-answers');
  document.getElementById('ansBtn').textContent='Show answers';
  document.getElementById('home').style.display='none';
  document.getElementById('topicView').classList.add('active');
  document.getElementById('tvTitle').textContent=current.name;
  document.getElementById('tvStrand').textContent=GROUP[current.group];
  document.getElementById('tvIntro').textContent=current.intro;
  setDiff('simple',true);
  window.scrollTo(0,0);
}
function goHome(){
  document.getElementById('topicView').classList.remove('active');
  document.getElementById('home').style.display='block';
  window.scrollTo(0,0);
}
function setDiff(d,skip){
  diff=d;
  document.getElementById('tabSimple').classList.toggle('on',d==='simple');
  document.getElementById('tabHard').classList.toggle('on',d==='hard');
  if(!skip||!data) data=GEN(current.id);
  renderQuestions();
}
function regen(){data=GEN(current.id);renderQuestions();}
function qItem(item){
  return `<li>
      <div class="qtext">${item.q}</div>
      <button class="reveal" onclick="this.nextElementSibling.style.display='block';this.style.display='none'">Reveal answer</button>
      <div class="ans">${item.a}</div></li>`;
}
function renderQuestions(){
  const isComp = current.id==='comprehension';
  const sel = diff==='simple'?data.simple:data.hard;
  let count, body;
  if(isComp){
    count = sel.reduce((n,p)=>n+p.qs.length,0);
    body = sel.map((p,idx)=>`
      <div class="passage"><span class="ptag">Passage ${idx+1}</span>
        <h4>${p.title}</h4><p>${p.text}</p></div>
      <div class="qgroup-label">Questions about Passage ${idx+1}: ${p.title}</div>
      <ol class="questions">${p.qs.map(qItem).join('')}</ol>`).join('');
  } else {
    count = sel.length;
    body = `<ol class="questions">${sel.map(qItem).join('')}</ol>`;
  }
  document.getElementById('wsTitle').innerHTML=
    `${current.name} — Worksheet <span class="pill ${diff==='simple'?'green':'berry'}">${diff} · ${count} questions</span>`;
  document.getElementById('qList').innerHTML=body;
  document.getElementById('wsNote').textContent = isComp
    ? 'Read each passage carefully, then answer the questions about it.'
    : current.id==='writing'
      ? 'For writing tasks there is no single right answer — the answer shows an example or what to aim for.'
      : 'Work them out in your book, then check with “Show answers”.';
}
function toggleAnswers(){
  const on=document.body.classList.toggle('show-answers');
  document.getElementById('ansBtn').textContent=on?'Hide answers':'Show answers';
}
renderGrid();
</script>
<script src="site.js" defer></script>
