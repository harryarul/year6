<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year 6 Learning Hub — NSW Stage 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf6ec;
    --ink:#2b2b2e;
    --teal:#1f7a72; --teal-dk:#155a54;
    --coral:#ee6c4d; --coral-dk:#d4502f;
    --green:#3a9d6b; --green-dk:#2c7a52;
    --amber:#e6a23c; --amber-dk:#c2811f;
    --ocean:#3a7ca5; --ocean-dk:#2c5f7e;
    --berry:#c25b87; --berry-dk:#9e426a;
    --leaf:#7a9e3a; --leaf-dk:#5f7e2c;
    --line:#e6dcc8;
    --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Nunito',sans-serif;color:var(--ink);
    background:
      radial-gradient(circle at 10% 6%, rgba(244,185,66,.18), transparent 40%),
      radial-gradient(circle at 90% 94%, rgba(31,122,114,.13), transparent 46%),
      var(--paper);
    background-attachment:fixed;min-height:100vh;line-height:1.5;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',cursive;letter-spacing:.2px}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 18px 80px}

  header.hero{text-align:center;padding:40px 0 16px;position:relative}
  header.hero .kicker{
    display:inline-block;background:var(--teal);color:#fff;font-weight:800;
    font-size:.78rem;letter-spacing:1.6px;text-transform:uppercase;padding:5px 15px;
    border-radius:30px;margin-bottom:14px;box-shadow:0 4px 0 var(--teal-dk)
  }
  header.hero h1{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.02}
  header.hero h1 .a{color:var(--coral)}
  header.hero p.sub{max-width:560px;margin:12px auto 0;color:#6a6357;font-weight:600;font-size:1.05rem}

  .deco{display:flex;justify-content:center;gap:10px;margin:22px 0 4px}
  .deco span{width:12px;height:12px;border-radius:4px;transform:rotate(45deg);opacity:.85}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:30px}

  .tile{
    display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);
    background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;
    position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.07);
    transition:transform .14s ease, box-shadow .14s ease;
  }
  .tile::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
    border-radius:50%;background:var(--accent);opacity:.08}
  .tile.ready{cursor:pointer}
  .tile.ready:hover{transform:translateY(-5px);box-shadow:0 13px 0 rgba(0,0,0,.07)}
  .tile.soon{opacity:.92}
  .icon{
    width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb, var(--accent) 14%, white);color:var(--accent);
    margin-bottom:14px;box-shadow:0 3px 0 color-mix(in srgb, var(--accent) 22%, white)
  }
  .icon svg{width:30px;height:30px}
  .tile h3{font-size:1.45rem;line-height:1.05}
  .tile p{font-size:.9rem;color:#867d6d;font-weight:600;margin-top:6px;min-height:38px}
  .cta{
    margin-top:14px;font-family:'Baloo 2';font-size:.95rem;align-self:flex-start;
    background:var(--accent);color:#fff;padding:7px 16px;border-radius:24px;
    box-shadow:0 3px 0 var(--accent-dk)
  }
  .soon-badge{
    margin-top:14px;align-self:flex-start;font-family:'Baloo 2';font-size:.8rem;
    background:var(--paper);border:2px dashed var(--line);color:#9a917f;padding:6px 14px;border-radius:24px
  }

  footer.site{text-align:center;margin-top:46px;color:#9a917f;font-size:.82rem;font-weight:600}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <span class="kicker">NSW Primary · Stage 3</span>
    <h1>Year 6 <span class="a">Learning Hub</span></h1>
    <p class="sub">Pick a subject to start exploring. More subjects are being added — check back soon!</p>
    <div class="deco">
      <span style="background:var(--coral)"></span>
      <span style="background:var(--teal)"></span>
      <span style="background:var(--green)"></span>
      <span style="background:var(--amber)"></span>
      <span style="background:var(--ocean)"></span>
      <span style="background:var(--berry)"></span>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <footer class="site">
    <p>Aligned to the NSW curriculum, Stage 3 (Years 5–6).</p>
  </footer>
</div>

<script>
/* =====================================================================
   SUBJECT TILES — edit here
   ---------------------------------------------------------------------
   To switch a subject ON: set  ready:true  and make sure a page with the
   matching "file" name sits in this same /year6/ folder.
   You can freely change the "desc" text once you have your content.
   ===================================================================== */
const SUBJECTS=[
  {
    name:'English', file:'english.html', ready:false,
    desc:'Reading, writing, spelling, grammar and comprehension.',
    accent:'var(--coral)', dk:'var(--coral-dk)', icon:'book'
  },
  {
    name:'Mathematics', file:'maths.html', ready:true,
    desc:'Number, measurement, space, statistics — with practice worksheets.',
    accent:'var(--teal)', dk:'var(--teal-dk)', icon:'maths'
  },
  {
    name:'Science & Technology', file:'science.html', ready:false,
    desc:'Living things, materials, forces, and the digital world.',
    accent:'var(--green)', dk:'var(--green-dk)', icon:'flask'
  },
  {
    name:'History', file:'history.html', ready:false,
    desc:'Australia as a nation, democracy, and people of the past.',
    accent:'var(--amber)', dk:'var(--amber-dk)', icon:'clock'
  },
  {
    name:'Geography', file:'geography.html', ready:false,
    desc:'Places, environments, maps and the wider world.',
    accent:'var(--ocean)', dk:'var(--ocean-dk)', icon:'globe'
  },
  {
    name:'Creative Arts', file:'arts.html', ready:false,
    desc:'Visual arts, music, drama and dance.',
    accent:'var(--berry)', dk:'var(--berry-dk)', icon:'palette'
  },
  {
    name:'Health & PE', file:'pdhpe.html', ready:false,
    desc:'Healthy bodies, wellbeing, movement and games.',
    accent:'var(--leaf)', dk:'var(--leaf-dk)', icon:'heart'
  }
];

/* simple inline SVG icon set */
const ICONS={
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6C10 4.5 6.5 4.5 4 6v13c2.5-1.5 6-1.5 8 0 2-1.5 5.5-1.5 8 0V6c-2.5-1.5-6-1.5-8 0z"/><path d="M12 6v13"/></svg>',
  maths:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h6M7 5v6"/><path d="M14.5 6l4 4M18.5 6l-4 4"/><path d="M4 17h6"/><circle cx="7" cy="14.3" r=".6" fill="currentColor" stroke="none"/><circle cx="7" cy="19.7" r=".6" fill="currentColor" stroke="none"/><path d="M14 15h6M14 19h6"/></svg>',
  flask:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6l-4.5 8.5A2 2 0 0 0 7.3 21h9.4a2 2 0 0 0 1.8-3.5L14 9V3"/><path d="M7.5 15h9"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.6 2.4 2.6 14.6 0 17M12 3.5c-2.6 2.4-2.6 14.6 0 17"/></svg>',
  palette:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a8.5 8.5 0 0 0 0 17c1.4 0 1.9-1 1.9-1.9 0-1.4 1-1.9 1.9-1.9h1a3.8 3.8 0 0 0 3.7-3.8c0-4.8-3.8-7.4-8.5-7.4z"/><circle cx="8" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="11" r="1" fill="currentColor" stroke="none"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.6-7-9.6A3.6 3.6 0 0 1 12 7.2 3.6 3.6 0 0 1 19 10.4C19 15.4 12 20 12 20z"/><path d="M7.5 12h2l1-2 2 4 1-2h2"/></svg>'
};

const grid=document.getElementById('grid');
grid.innerHTML=SUBJECTS.map(s=>{
  const inner=`
    <div class="icon">${ICONS[s.icon]||''}</div>
    <h3>${s.name}</h3>
    <p>${s.desc}</p>
    ${s.ready?'<span class="cta">Start learning →</span>':'<span class="soon-badge">Coming soon</span>'}`;
  const style=`--accent:${s.accent};--accent-dk:${s.dk}`;
  return s.ready
    ? `<a class="tile ready" href="${s.file}" style="${style}">${inner}</a>`
    : `<div class="tile soon" style="${style}">${inner}</div>`;
}).join('');
</script>
</body>
</html>
