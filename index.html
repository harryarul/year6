<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year 6 Learning Hub — NSW Stage 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf6ec;
    --ink:#2b2b2e;
    --teal:#1f7a72; --teal-dk:#155a54;
    --coral:#ee6c4d; --coral-dk:#d4502f;
    --green:#3a9d6b; --green-dk:#2c7a52;
    --amber:#e6a23c; --amber-dk:#c2811f;
    --ocean:#3a7ca5; --ocean-dk:#2c5f7e;
    --berry:#c25b87; --berry-dk:#9e426a;
    --leaf:#7a9e3a; --leaf-dk:#5f7e2c;
    --line:#e6dcc8;
    --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Nunito',sans-serif;color:var(--ink);
    background:
      radial-gradient(circle at 10% 6%, rgba(244,185,66,.18), transparent 40%),
      radial-gradient(circle at 90% 94%, rgba(31,122,114,.13), transparent 46%),
      var(--paper);
    background-attachment:fixed;min-height:100vh;line-height:1.5;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',cursive;letter-spacing:.2px}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 18px 80px}

  header.hero{text-align:center;padding:40px 0 16px;position:relative}
  header.hero .kicker{
    display:inline-block;background:var(--teal);color:#fff;font-weight:800;
    font-size:.78rem;letter-spacing:1.6px;text-transform:uppercase;padding:5px 15px;
    border-radius:30px;margin-bottom:14px;box-shadow:0 4px 0 var(--teal-dk)
  }
  header.hero h1{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.02}
  header.hero h1 .a{color:var(--coral)}
  header.hero p.sub{max-width:560px;margin:12px auto 0;color:#6a6357;font-weight:600;font-size:1.05rem}

  .deco{display:flex;justify-content:center;gap:10px;margin:22px 0 4px}
  .deco span{width:12px;height:12px;border-radius:4px;transform:rotate(45deg);opacity:.85}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:30px}

  .tile{
    display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);
    background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;
    position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.07);
    transition:transform .14s ease, box-shadow .14s ease;
  }
  .tile::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
    border-radius:50%;background:var(--accent);opacity:.08}
  .tile.ready{cursor:pointer}
  .tile.ready:hover{transform:translateY(-5px);box-shadow:0 13px 0 rgba(0,0,0,.07)}
  .tile.soon{opacity:.92}
  .icon{
    width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb, var(--accent) 14%, white);color:var(--accent);
    margin-bottom:14px;box-shadow:0 3px 0 color-mix(in srgb, var(--accent) 22%, white)
  }
  .icon svg{width:30px;height:30px}
  .tile h3{font-size:1.45rem;line-height:1.05}
  .tile p{font-size:.9rem;color:#867d6d;font-weight:600;margin-top:6px;min-height:38px}
  .cta{
    margin-top:14px;font-family:'Baloo 2';font-size:.95rem;align-self:flex-start;
    background:var(--accent);color:#fff;padding:7px 16px;border-radius:24px;
    box-shadow:0 3px 0 var(--accent-dk)
  }
  .soon-badge{
    margin-top:14px;align-self:flex-start;font-family:'Baloo 2';font-size:.8rem;
    background:var(--paper);border:2px dashed var(--line);color:#9a917f;padding:6px 14px;border-radius:24px
  }

  footer.site{text-align:center;margin-top:46px;color:#9a917f;font-size:.82rem;font-weight:600}

  /* top panel */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:14px 0 4px;flex-wrap:wrap}
  .topbar .brand{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.05rem;color:var(--teal);
    display:inline-flex;align-items:center;gap:8px}
  .topbar .brand .mark{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;background:color-mix(in srgb, var(--teal) 14%, white);font-size:1.05rem}
  .brain-btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    font-family:'Baloo 2',cursive;font-weight:700;font-size:1rem;color:#fff;
    background:var(--coral);padding:10px 20px;border-radius:30px;
    box-shadow:0 4px 0 var(--coral-dk);transition:transform .14s ease, box-shadow .14s ease}
  .brain-btn .b{font-size:1.15rem}
  .brain-btn:hover{transform:translateY(-3px);box-shadow:0 7px 0 var(--coral-dk)}
  .brain-btn:active{transform:translateY(1px);box-shadow:0 2px 0 var(--coral-dk)}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="brand"><span class="mark">📚</span> Year 6 Hub</span>
    <a class="brain-btn" href="brain-activation-hq.html"><span class="b">🧠</span> Brain Activation</a>
  </div>

  <header class="hero">
    <span class="kicker">NSW Primary · Stage 3</span>
    <h1>Year 6 <span class="a">Learning Hub</span></h1>
    <p class="sub">Pick a subject to start exploring. More subjects are being added — check back soon!</p>
    <div class="deco">
      <span style="background:var(--coral)"></span>
      <span style="background:var(--teal)"></span>
      <span style="background:var(--green)"></span>
      <span style="background:var(--amber)"></span>
      <span style="background:var(--ocean)"></span>
      <span style="background:var(--berry)"></span>
    </div>
  </header>

  <div class="grid" id="subject-grid"></div>
</div>

<script src="site.js" defer></script>
</body>
</html>
